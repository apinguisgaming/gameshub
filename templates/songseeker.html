<!DOCTYPE html>
<html lang="de" translate="no">
<head>
  <title>SongSeeker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='songseeker/icon-180x180.png') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='songseeker/icon-192x192.png') }}">
  <link rel="icon" type="image/png" sizes="96x96" href="{{ url_for('static', filename='songseeker/icon-96x96.png') }}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='songseeker/favicon.ico') }}">
  <link rel="shortcut icon" sizes="192x192" href="{{ url_for('static', filename='songseeker/icon-192x192.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='songseeker/manifest.json') }}">

  <style>
    :root {
      --bg-color: #f0f0f0;
      --surface-color: #ffffff;
      --text-primary: #121212;
      --border-color: #121212;
      --accent-gray: #d0d0d0;
      --border-width: 3px;
      --black: #000000;
      --white: #ffffff;
      --team1-pink: #ff8fbd;
      --team2-blue: #84bbee;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0.5rem;
      line-height: 1.4;
      overflow-x: hidden;
      width: 100%;
    }

    h2#main-header {
      font-family: 'Archivo', sans-serif;
      font-weight: 900;
      font-size: clamp(1.8rem, 8vw, 3.2rem); 
      text-transform: uppercase;
      letter-spacing: -1.5px;
      margin: 0.2rem 0 1.2rem;
      color: var(--text-primary);
      display: inline-block;
      padding: 0.5rem 1.5rem;
      background: var(--surface-color);
      border: var(--border-width) solid var(--border-color);
      box-shadow: 5px 5px 0px var(--border-color);
      transform: rotate(-1deg);
      text-align: center;
    }

    hr {
      border: none;
      height: var(--border-width);
      background: var(--border-color);
      width: 100%;
      max-width: 500px;
      margin: 2rem 0;
    }

    /* Buttons */
    .button, .button_startscan, .button_startstop, #cancelScanButton, #debugButton, #doneButton, .game-control-btn {
      font-family: 'Archivo', sans-serif;
      font-weight: 700;
      font-size: clamp(0.75rem, 2.8vw, 0.95rem);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: var(--surface-color) !important;
      color: var(--text-primary) !important;
      border: var(--border-width) solid var(--border-color);
      border-radius: 0;
      padding: 0.65rem 1rem;
      cursor: pointer;
      box-shadow: 4px 4px 0px var(--border-color);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      user-select: none;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .button:hover, .button_startscan:hover, .button_startstop:hover, .game-control-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0px var(--border-color);
      background: var(--black) !important;
      color: var(--white) !important;
    }

    .button:active, .game-control-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--border-color);
    }

    .button_startscan { min-width: 170px; font-size: 1.05rem; }

    .button_startstop::before {
      content: "";
      display: inline-block;
      width: 0.9rem;
      height: 0.9rem;
      margin-right: 0.5rem;
      background: url('data:image/svg+xml;utf8,<svg fill="black" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polygon points="6,4 20,12 6,20" /></svg>') no-repeat center center;
      background-size: contain;
    }

    /* Scanner Box */
    #scanner-box {
      width: 95%;
      max-width: 480px;
      aspect-ratio: 1 / 1;
      background: var(--surface-color);
      border: var(--border-width) solid var(--border-color);
      position: relative;
      box-shadow: 7px 7px 0px var(--border-color);
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #playback-ui {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }

    #video-wrapper {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: #000;
      display: none;
      z-index: 5;
    }

    #qr-video { width: 100%; height: 100%; object-fit: cover; }

    #cancelScanButton {
      position: absolute;
      top: -12px; right: -8px; z-index: 20;
      background: #000 !important; color: #fff !important;
      font-size: 0.75rem; padding: 0.4rem 0.8rem;
      display: none;
    }

    #audio-visualizer { display: none; }
    #audio-visualizer svg { width: 70px; height: 50px; display: block; }
    .bar {
      transform-origin: bottom;
      animation: bounce 0.6s ease infinite alternate;
      animation-play-state: paused;
    }
    .bar.playing { animation-play-state: running; }
    .bar1 { animation-delay: 0s; }
    .bar2 { animation-delay: 0.2s; }
    .bar3 { animation-delay: 0.4s; }
    @keyframes bounce { 0% { transform: scaleY(0.2); } 100% { transform: scaleY(1); } }

    #videoid, #videotitle, #videoduration, #videostart {
      font-family: 'Inter', monospace;
      font-weight: 600;
      background: var(--surface-color);
      border-left: 5px solid var(--black);
      border-bottom: 2px solid #ccc;
      padding: 0.6rem; margin: 0.3rem 0;
      width: 95%; max-width: 500px;
      display: none; font-size: 0.85rem;
    }

    /* Settings Area */
    #show_hide_settings {
      margin: 1rem 0; font-weight: 700;
      display: flex; align-items: center; gap: 0.6rem; cursor: pointer;
    }
    .settings_div {
      width: 95%; max-width: 500px;
      background: var(--surface-color);
      border: var(--border-width) solid var(--border-color);
      padding: 1.5rem 1rem;
      box-shadow: 6px 6px 0px var(--border-color);
      display: flex; flex-direction: column; gap: 1.2rem;
    }
    .settings_div.hidden { display: none !important; }

    .text-block {
      position: relative;
      border: 2px solid var(--border-color);
      padding: 1.2rem 0.8rem 0.8rem;
      background: #fafafa;
    }
    .text-block .heading {
      position: absolute;
      top: -11px; left: 0.8rem;
      background: var(--black); color: var(--white);
      padding: 0.1rem 0.5rem;
      font-family: 'Archivo', sans-serif;
      font-weight: 700; text-transform: uppercase; font-size: 0.75rem;
    }

    input[type="checkbox"] {
      appearance: none; -webkit-appearance: none;
      width: 1.3rem; height: 1.3rem;
      border: 2px solid var(--border-color);
      background: var(--white); cursor: pointer;
      vertical-align: middle; margin-right: 0.5rem;
    }
    input[type="checkbox"]:checked { background: var(--black); position: relative; }
    input[type="checkbox"]:checked::after {
      content: ''; position: absolute;
      left: 4px; top: 1px; width: 4px; height: 8px;
      border: solid white; border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    input[type="number"] {
      border: 2px solid var(--border-color);
      background: var(--white); padding: 0.3rem;
      font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 0.9rem;
      width: 4rem; text-align: center;
    }

    #player { position: absolute; width: 10px; height: 10px; opacity: 0.01; pointer-events: none; z-index: -10; top: 0; left: 0; }

    #status-message, #local-status-message {
      font-family: 'Archivo', sans-serif;
      font-weight: 900;
      font-size: clamp(0.85rem, 3.5vw, 1.05rem);
      text-transform: uppercase;
      text-align: center;
      background: var(--surface-color);
      color: var(--black);
      border: var(--border-width) solid var(--border-color);
      padding: 0.6rem 1rem;
      box-shadow: 4px 4px 0px var(--border-color);
      margin: 0.5rem 0;
      display: none;
      z-index: 10;
      width: 95%; max-width: 500px;
    }

    .pulsing { animation: pulse 0.8s infinite alternate ease-in-out; }
    @keyframes pulse { 0% { opacity: 0.6; transform: scale(0.98); } 100% { opacity: 1; transform: scale(1.01); } }

    /* ==========================================================================
       LOCAL MODE
       ========================================================================== */
    #local-mode-ui {
      width: 100%;
      max-width: 800px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }

    #turn-indicator {
      font-family: 'Archivo', sans-serif;
      font-weight: 900;
      font-size: clamp(1.2rem, 5vw, 1.8rem);
      text-transform: uppercase;
      text-align: center;
      margin: 0.2rem 0;
    }

    /* Moving Bottom Controls Bar */
    #local-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface-color);
      border-top: var(--border-width) solid var(--border-color);
      box-shadow: 0px -4px 0px rgba(0,0,0,0.08);
      padding: 0.5rem 0.8rem calc(0.5rem + env(safe-area-inset-bottom, 0px));
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .bottom-bar-inner {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .bottom-bar-left,
    .bottom-bar-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
    }

    .bottom-bar-left {
      justify-content: flex-start;
    }

    .bottom-bar-center {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .bottom-bar-right {
      justify-content: flex-end;
    }

    .icon-btn-square {
      width: 2.85rem !important;
      height: 2.85rem !important;
      padding: 0 !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      box-sizing: border-box;
    }

    .icon-btn-square.play-btn {
      width: 3.2rem !important;
      height: 3.2rem !important;
    }

    #local-gameboard {
      padding-bottom: 85px; /* Spacing so timeline elements aren't covered by bottom bar */
    }

    /* Active Drawn Question Card in the Center */
    #current-card-area {
      width: 155px;
      height: 110px;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0.2rem auto 0.5rem;
    }

    /* Hitster Card Component (touch-action: pan-y allows full vertical page scrolling!) */
    .hitster-card {
      border: var(--border-width) solid var(--border-color);
      background: var(--surface-color);
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      width: 100% !important;
      height: 110px !important;
      max-height: 110px !important;
      padding: 3px 5px !important;
      box-shadow: 4px 4px 0px var(--border-color);
      margin: 0 auto;
      user-select: none;
      touch-action: pan-y; /* Erlaubt vertikales Scrollen über allen Karten! */
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    /* Only the active draggable card captures drag movements */
    #cc-card[data-draggable="true"] {
      touch-action: none;
    }

    .hitster-card .side-text {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      text-align: center;
      line-height: 1.1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      word-break: break-word;
      hyphens: auto;
      width: 32% !important;
      height: 100% !important;
      box-sizing: border-box;
    }

    .hitster-card .year {
      font-family: 'Archivo', sans-serif;
      font-weight: 900;
      font-size: 1.6rem !important;
      flex: 1;
      height: 100% !important;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      margin: 0;
      padding: 0;
    }

    /* Question Card Styling */
    #cc-card.hitster-card {
      border: var(--border-width) solid var(--black);
    }
    #cc-card.team1-card,
    #drag-ghost-clone.team1-card {
      background-color: var(--team1-pink);
    }
    #cc-card.team2-card,
    #drag-ghost-clone.team2-card {
      background-color: var(--team2-blue);
      flex-direction: row-reverse;
    }
    #cc-card .year {
      font-size: 1.6rem !important;
    }
    #cc-card .side-text,
    #cc-card .year {
      writing-mode: vertical-rl;
      transform: none;
    }
    #cc-card.team2-card .side-text,
    #cc-card.team2-card .year,
    #drag-ghost-clone.team2-card .side-text,
    #drag-ghost-clone.team2-card .year {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    /* Placed Team Cards (Permanent cards placed in timelines) */
    .timeline .hitster-card:not(#cc-card).team1-card {
      background-color: var(--team1-pink) !important;
    }
    .timeline .hitster-card:not(#cc-card).team2-card {
      background-color: var(--team2-blue) !important;
    }

    /* Text orientations */
    .team1-card .side-text,
    .team1-card .year {
      writing-mode: vertical-rl;
      transform: none;
    }
    .team2-card {
      flex-direction: row-reverse;
    }
    .team2-card .side-text,
    .team2-card .year {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    /* FLOATING GHOST CLONE */
    .drag-ghost {
      position: fixed !important;
      pointer-events: none !important;
      z-index: 99999 !important;
      opacity: 0.9 !important;
      transform: translate(-50%, -50%) !important;
      width: 140px !important;
      height: 105px !important;
      box-shadow: 8px 8px 0px rgba(0,0,0,0.4) !important;
    }

    /* 2-Column Teams Grid */
    #local-teams-container {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      gap: 8px !important;
      width: 100% !important;
      max-width: 340px !important;
      align-items: start;
    }

    .team-box {
      border: var(--border-width) solid var(--black);
      padding: 6px 4px;
      background: var(--surface-color);
      box-shadow: 4px 4px 0px var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0 !important;
      width: 100% !important;
      touch-action: pan-y;
    }

    .team1-header {
      text-align: center;
      font-family: 'Archivo', sans-serif;
      font-weight: 900;
      margin-bottom: 0.3rem;
      font-size: 0.95rem;
      text-transform: uppercase;
    }

    .team2-header {
      text-align: center;
      font-family: 'Archivo', sans-serif;
      font-weight: 900;
      margin-bottom: 0.3rem;
      font-size: 0.95rem;
      text-transform: uppercase;
      transform: rotate(180deg);
    }

    .timeline {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 8px;
      touch-action: pan-y;
    }

    /* All empty dropzones are completely removed from layout (display: none) when not dragging */
    .dropzone:empty,
    .dropzone:not(.placed-dz):not(:has(#cc-card)) {
      display: none;
    }

    /* Only while actively dragging, available dropzones appear as dashed slots */
    body.is-card-dragging .dropzone.available-dz {
      display: block !important;
      width: 100%;
      height: 14px;
      min-height: 14px;
      border: 2px dashed #777;
      border-radius: 4px;
      margin: 2px 0;
      box-sizing: border-box;
      transition: height 0.15s ease, margin 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
      cursor: pointer;
    }

    body.is-card-dragging .dropzone.active-dz {
      height: 20px;
      min-height: 20px;
      border-color: var(--black) !important;
      background-color: var(--accent-gray) !important;
      border-style: solid !important;
      margin: 2px 0;
    }

    /* Placed Dropzone (Holding #cc-card) */
    .dropzone:has(#cc-card),
    .dropzone.placed-dz {
      display: block !important;
      width: 100% !important;
      max-height: 120px;
      overflow: hidden;
      border: none !important;
      margin: 0 !important;
      padding: 0 !important;
      background: transparent !important;
      transform: none !important;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.35s ease,
                  margin-bottom 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Simultaneous Card & Container Dismissal */
    .dropzone.card-dismissing {
      max-height: 0px !important;
      opacity: 0 !important;
      margin-bottom: -8px !important;
      pointer-events: none !important;
    }

    .flash-error-btn {
      background: #ff4d4d !important;
      color: #fff !important;
      animation: pulse 0.5s infinite alternate;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
</head>

<body>
  <h2 id="main-header">SongSeeker</h2>

  <div style="display: flex; gap: 0.8rem; margin-bottom: 0.8rem;">
    <button id="toggleLocalModeButton" class="button">Local Mode</button>
  </div>

  <!-- LOCAL MODE UI -->
  <div id="local-mode-ui">
      <!-- Setup Screen -->
      <div id="local-setup" class="settings_div" style="display: flex;">
          <div class="text-block">
              <div class="heading">Select Packs</div>
              <div id="pack-selection" style="display: flex; flex-direction: column; gap: 0.6rem;">
                  <label><input type="checkbox" value="playlists/hitster-de.csv" checked> Hitster Deutschland</label>
                  <label><input type="checkbox" value="playlists/hitster-de-aaaa0007.csv"> Hitster DE Schlagerparty</label>
                  <label><input type="checkbox" value="playlists/hitster-de-aaaa0012.csv"> Hitster DE Summer Party</label>
                  <label><input type="checkbox" value="playlists/hitster-de-aaaa0015.csv"> Hitster DE Guilty Pleasures</label>
                  <label><input type="checkbox" value="playlists/hitster-de-aaaa0019.csv"> Hitster DE Bingo</label>
                  <label><input type="checkbox" value="playlists/hitster-de-aaaa0025.csv"> Hitster DE Bayern 1 Expansion</label>
                  <label><input type="checkbox" value="playlists/hitster-de-aaaa0026.csv"> Hitster DE Movies & TV Expansion</label>
                  <label><input type="checkbox" value="playlists/hitster-de-aaaa0039.csv"> Hitster DE Rock</label>
                  <label><input type="checkbox" value="playlists/hitster-de-aaaa0040.csv"> Hitster DE Celebration</label>
                  <label><input type="checkbox" value="playlists/mysongs.csv"> Eigenes Pack</label>
                  <label><input type="checkbox" value="playlists/mysongs_ext.csv"> Eigenes Pack + Erweiterung</label>
              </div>
          </div>
          <button id="startLocalGameBtn" class="button" style="background: var(--black) !important; color: var(--white) !important;">Start Local Game</button>
      </div>

      <!-- Game Board -->
      <div id="local-gameboard" style="display: none; width: 100%; flex-direction: column; gap: 0.8rem; align-items: center;">
          <div id="turn-indicator">Team 1's Turn</div>
          
          <div id="local-status-message"></div>

          <!-- Question Card Slot -->
          <div id="current-card-area">
              <div id="cc-card" class="hitster-card" data-draggable="false" style="cursor: grab;">
                  <div id="cc-title" class="side-text">...to Song</div>
                  <div id="cc-year" class="year">?</div>
                  <div id="cc-artist" class="side-text">Listen...</div>
              </div>
          </div>

          <!-- Strict 2-Column Teams Grid -->
          <div id="local-teams-container">
              <div id="team1-area" class="team-box">
                  <h3 class="team1-header">Team 1</h3>
                  <div id="team1-timeline" class="timeline"></div>
              </div>
              <div id="team2-area" class="team-box">
                  <h3 class="team2-header">Team 2</h3>
                  <div id="team2-timeline" class="timeline"></div>
              </div>
          </div>
      </div>

      <!-- Moving Bottom Action Bar -->
      <div id="local-bottom-bar">
          <div class="bottom-bar-inner">
              <div class="bottom-bar-left">
                  <button id="resetLocalBtn" class="game-control-btn" title="Reset Game">
                      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px;">
                          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                          <path d="M3 3v5h5"/>
                      </svg>
                      RESET
                  </button>
              </div>

              <div class="bottom-bar-center">
                  <button id="localPlayPauseBtn" class="game-control-btn icon-btn-square play-btn" style="display: none;" title="Play/Pause">
                      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                          <polygon points="6,4 20,12 6,20"/>
                      </svg>
                  </button>
              </div>

              <div class="bottom-bar-right">
                  <button id="drawCardBtn" class="game-control-btn" title="Draw New Card">
                      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px;">
                          <rect x="3" y="3" width="18" height="18" rx="2"/>
                          <line x1="12" y1="8" x2="12" y2="16"/>
                          <line x1="8" y1="12" x2="16" y2="12"/>
                      </svg>
                      DRAW
                  </button>
                  <button id="skipCardBtn" class="game-control-btn" style="display: none; background: #fff0f0 !important;" title="Song defekt / überspringen">
                      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px;">
                          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                          <line x1="12" y1="9" x2="12" y2="13"/>

                  </button>
                  <button id="revealCardBtn" class="game-control-btn" style="display: none; background: #e0f2fe !important;" title="Reveal Card">
                      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px;">
                          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>

                      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px;">
                          <line x1="18" y1="6" x2="6" y2="18"></line>
                          <line x1="6" y1="6" x2="18" y2="18"></line>
                      </svg>
                      DISMISS
                  </button>
              </div>
          </div>
      </div>
  </div>

  <!-- QR SCANNER BOX (MANUAL MODE) -->
  <div id="scanner-box">
    <button id="cancelScanButton" class="button">Cancel Scan</button>
    <div id="video-wrapper">
      <video id="qr-video" playsinline></video>
    </div>

    <div id="status-message"></div>
    
    <button id="startScanButton" class="button_startscan">Start Scan</button>
    
    <div id="playback-ui">
      <div id="audio-visualizer">
        <svg viewBox="0 0 40 30">
          <rect class="bar bar1" x="2" y="0" width="8" height="30" fill="var(--black)" />
          <rect class="bar bar2" x="16" y="0" width="8" height="30" fill="var(--black)" />
          <rect class="bar bar3" x="30" y="0" width="8" height="30" fill="var(--black)" />
        </svg>
      </div>
      <button id="startstop-video" class="button_startstop">Play</button>
    </div>
  </div>

  <button id="doneButton" class="button">Done / Next Song</button>

  <div id="videoid">Video ID: <span id="video-id"></span></div>
  <div id="videotitle">Video Title: <span id="video-title"></span></div>
  <div id="videoduration">Video Duration: <span id="video-duration"></span></div>
  <div id="videostart">Start Time: <span id="video-start"></span></div>

  <hr />

  <!-- SETTINGS -->
  <div id="show_hide_settings">
    <input type="checkbox" id="cb_settings" name="cb_settings" />
    <label for="cb_settings">Show / Hide settings</label>
  </div>
  
  <div class="settings_div hidden" id="settings_div">
    <div class="text-block">
      <div class="heading">Autoplay</div>
      <div>
        <input type="checkbox" id="autoplay" name="autoplay" />
        <label for="autoplay">Autoplay</label>
      </div>
    </div>

    <div class="text-block">
      <div class="heading">Random Playback</div>
      <div>
        <input type="checkbox" id="randomplayback" name="randomplayback" />
        <label for="randomplayback">Random Playback</label>
        <br />
        <label for="playback-duration">Playback Duration (seconds): </label>
        <input type="number" id="playback-duration" value="30">
      </div>
    </div>

    <div class="text-block">
      <div class="heading">Debug</div>
      <div>
        <input type="checkbox" id="songinfo" name="songinfo" />
        <label for="songinfo">Show song info</label>
        <br />
        <input type="checkbox" id="cookies" name="cookies" />
        <label for="cookies">Show cookies</label>
        <span id="cookielist"></span>
        <br />
        <button id="debugButton" class="button" style="margin: 0.8rem 0 0 0;">Debug Scan</button>
      </div>
    </div>
  </div>

  <div id="player"></div>

  <!-- QR Scanner Script -->
  <script type="module">
    import QrScanner from "https://unpkg.com/qr-scanner/qr-scanner.min.js";

    window.staticBaseUrl = "{{ url_for('static', filename='songseeker/') }}";

    let player; 
    let playbackTimer; 
    let playbackDuration = 30; 
    let qrScanner;
    let csvCache = {};
    let lastDecodedText = ""; 
    let currentStartTime = 0;

    function isIOS() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    }

    document.addEventListener('DOMContentLoaded', function () {
        const video = document.getElementById('qr-video');

        if (isIOS()) {
            var autoplayCheckbox = document.getElementById('autoplay');
            if (autoplayCheckbox) {
                autoplayCheckbox.checked = false;
                autoplayCheckbox.disabled = true;
            }
        }

        qrScanner = new QrScanner(video, result => {
            if (result.data !== lastDecodedText) {
                lastDecodedText = result.data; 
                handleScannedLink(result.data);
            }
        }, { 
            highlightScanRegion: true,
            highlightCodeOutline: true,
        });
    });

    function setUIState(state) {
        const startBtn = document.getElementById('startScanButton');
        const videoWrapper = document.getElementById('video-wrapper');
        const cancelBtn = document.getElementById('cancelScanButton');
        const playbackUI = document.getElementById('playback-ui');
        const visualizer = document.getElementById('audio-visualizer');
        const doneBtn = document.getElementById('doneButton');
        const playBtn = document.getElementById('startstop-video');
        const statusMsg = document.getElementById('status-message');

        const localUI = document.getElementById('local-mode-ui');
        const isLocalMode = localUI && localUI.style.display !== 'none';

        startBtn.style.display = 'none';
        videoWrapper.style.display = 'none';
        cancelBtn.style.display = 'none';
        playbackUI.style.display = 'none';
        visualizer.style.display = 'none';
        doneBtn.style.display = 'none';
        statusMsg.style.display = 'none';
        statusMsg.classList.remove('pulsing');

        if (state === 'IDLE') {
            startBtn.style.display = 'inline-flex';
            if (player && typeof player.pauseVideo === 'function') player.pauseVideo();
        } else if (state === 'SCANNING') {
            videoWrapper.style.display = 'block';
            cancelBtn.style.display = 'block';
        } else if (state === 'FETCHING') {
            statusMsg.textContent = '🔍 Fetching Song...';
            statusMsg.style.display = 'block';
            statusMsg.classList.add('pulsing');
        } else if (state === 'LOADING') {
            statusMsg.textContent = '⏳ Loading Audio...';
            statusMsg.style.display = 'block';
            statusMsg.classList.add('pulsing');
        } else if (state === 'ERROR') {
            statusMsg.style.display = 'block';
            if (!isLocalMode) doneBtn.style.display = 'inline-flex';
        } else if (state === 'CUED' || state === 'PAUSED') {
            playbackUI.style.display = 'flex';
            if (!isLocalMode) doneBtn.style.display = 'inline-flex';
            playBtn.innerHTML = "Play";
            playBtn.disabled = false;
        } else if (state === 'BUFFERING') {
            playbackUI.style.display = 'flex';
            if (!isLocalMode) doneBtn.style.display = 'inline-flex';
            playBtn.innerHTML = "Buffering...";
            playBtn.disabled = true;
        } else if (state === 'PLAYING') {
            playbackUI.style.display = 'flex';
            visualizer.style.display = 'block';
            if (!isLocalMode) doneBtn.style.display = 'inline-flex';
            playBtn.innerHTML = "Stop";
            playBtn.disabled = false;
        }
    }

    async function handleScannedLink(decodedText) {
        decodedText = decodedText.replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
        const isHitster = isHitsterLink(decodedText);
        const isYT = isYoutubeLink(decodedText);
        const isRock = isRockster(decodedText);

        if (!isHitster && !isYT && !isRock) return;

        qrScanner.stop();
        setUIState('FETCHING');

        let youtubeURL = "";
        if (isYT) {
            youtubeURL = decodedText;
        } else if (isHitster) {
            const hitsterData = parseHitsterUrl(decodedText);
            if (hitsterData) {
                try {
                    const csvUrl = `${window.staticBaseUrl}playlists/hitster-${hitsterData.lang}.csv`;
                    const csvContent = await getCachedCsv(csvUrl);
                    const youtubeLink = lookupYoutubeLink(hitsterData.id, csvContent);
                    if (youtubeLink) youtubeURL = youtubeLink;
                } catch (error) {
                    console.error("Failed to fetch CSV:", error);
                }
            }
        } else if (isRock) {
            try {
                const urlObj = new URL(decodedText); 
                const ytCode = urlObj.searchParams.get("yt"); 
                if (ytCode) youtubeURL = `https://www.youtube.com/watch?v=${ytCode}`;
            } catch (error) {}
        }

        if (youtubeURL !== "") {
            const youtubeLinkData = parseYoutubeLink(youtubeURL);
            if (youtubeLinkData) {
                lastDecodedText = ""; 
                document.getElementById('video-id').textContent = youtubeLinkData.videoId;  
                currentStartTime = youtubeLinkData.startTime || 0;
                setUIState('LOADING');
                player.cueVideoById(youtubeLinkData.videoId, currentStartTime);   
            }
        } else {
            setUIState('ERROR');
            document.getElementById('status-message').textContent = "❌ Song not found in Pack!";
        }
    }

    function isHitsterLink(url) { return /^(?:https?:\/\/)?(?:www\.)?(hitstergame|app\.hitsternordics)\.com\/.+/i.test(url.trim()); }
    function isYoutubeLink(url) { return url.startsWith("https://www.youtube.com") || url.startsWith("https://youtu.be") || url.startsWith("https://music.youtube.com/"); }
    function isRockster(url){ return url.startsWith("https://rockster.brettspiel.digital"); }

    function parseHitsterUrl(url) {
        url = url.trim();
        const regex = /^(?:https?:\/\/)?(?:www\.)?hitstergame\.com\/(.+?)\/(\d+)(?:[/?#].*)?$/i;
        const match = url.match(regex);
        if (match) {
            let pathPart = match[1].replace(/\//g, "-");
            let idStr = match[2];
            if (idStr.length === 5) {
                const packPrefix = idStr.substring(0, 2);
                const cardNum = idStr.substring(2);
                if (packPrefix === "00") return { lang: pathPart, id: parseInt(cardNum, 10).toString() };
                else {
                    let letterCode = "aaaa"; 
                    if (pathPart === "ca") letterCode = "aaad";
                    else if (pathPart === "hu" || pathPart === "pl") letterCode = "aaae";
                    return { lang: `${pathPart}-${letterCode}00${packPrefix}`, id: parseInt(cardNum, 10).toString() };
                }
            }
            return { lang: pathPart, id: idStr };
        }
        const regex_nordics = /^(?:https?:\/\/)?(?:www\.)?app\.hitster(nordics)\.com\/resources\/songs\/(\d+)(?:[/?#].*)?$/i;
        const match_nordics = url.match(regex_nordics);
        if (match_nordics) return { lang: match_nordics[1].toLowerCase(), id: match_nordics[2] };
        return null;
    }

    function lookupYoutubeLink(id, csvContent) {
        if (!csvContent || csvContent.length === 0) return null;
        const headers = csvContent[0].map(h => h ? h.replace(/^\uFEFF/, '').trim() : '');
        const cardIndex = headers.indexOf('Card#');
        const urlIndex = headers.indexOf('URL');
        if (cardIndex === -1 || urlIndex === -1) return null;

        const targetId = parseInt(id, 10); 
        for (let i = 1; i < csvContent.length; i++) {
            const row = csvContent[i];
            if (row && row[cardIndex] && parseInt(row[cardIndex], 10) === targetId) {
                return row[urlIndex].trim(); 
            }
        }
        return null; 
    }

    function parseCSV(text) {
        const lines = text.split('\n');
        return lines.map(line => {
            const result = [];
            let startValueIdx = 0;
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                if (line[i] === '"' && line[i-1] !== '\\') {
                    inQuotes = !inQuotes;
                } else if (line[i] === ',' && !inQuotes) {
                    result.push(line.substring(startValueIdx, i).trim().replace(/^"(.*)"$/, '$1'));
                    startValueIdx = i + 1;
                }
            }
            result.push(line.substring(startValueIdx).trim().replace(/^"(.*)"$/, '$1'));
            return result;
        });
    }

    async function getCachedCsv(url) {
        if (!csvCache[url]) { 
            const response = await fetch(url);
            const data = await response.text();
            csvCache[url] = parseCSV(data); 
        }
        return csvCache[url]; 
    }

    function parseYoutubeLink(url) {
        url = decodeURIComponent(url);
        const regex = /^https?:\/\/(www\.youtube\.com\/watch\?v=|youtu\.be\/|music\.youtube\.com\/watch\?v=)(.{11})(.*)/;
        const match = url.match(regex);
        if (match) {
            const queryParams = new URLSearchParams(match[3]); 
            const videoId = match[2];
            let startTime = queryParams.get('start') || queryParams.get('t');
            document.getElementById('video-start').textContent = startTime;
            startTime = startTime ? parseInt(startTime, 10) : 0;
            return { videoId, startTime: isNaN(startTime) ? 0 : startTime };
        }
        return null;
    }

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);

    window.onYouTubeIframeAPIReady = function() {
        player = new YT.Player('player', {
            height: '10',
            width: '10',
            playerVars: {
                'playsinline': 1
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange,
                'onError': onPlayerError
            }
        });
    };

    function onPlayerReady(event) {
        event.target.setVolume(100);
        event.target.unMute();
    }

    function onPlayerError(event) {
        let errorMsg = "❌ Audio Error!";
        if (event.data == 101 || event.data == 150) errorMsg = "❌ Blocked by Copyright Owner!";
        else if (event.data == 100) errorMsg = "❌ Video not found / deleted!";
        else if (event.data == 2) errorMsg = "❌ Invalid Video ID!";

        if (window.showLocalError) window.showLocalError(errorMsg);
        setUIState('ERROR');
        document.getElementById('status-message').textContent = errorMsg;
    }

    const SVG_PLAY = `<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>`;
    const SVG_PAUSE = `<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/></svg>`;

    window.setLocalPlayPauseIcon = function(isPlaying) {
        const localPlayBtn = document.getElementById('localPlayPauseBtn');
        if (localPlayBtn) {
            localPlayBtn.innerHTML = isPlaying ? SVG_PAUSE : SVG_PLAY;
        }
    };

    function onPlayerStateChange(event) {
        const visualizerBars = document.querySelectorAll('#audio-visualizer .bar');

        if (event.data == YT.PlayerState.CUED) {
            setUIState('CUED');
            var videoData = player.getVideoData();
            document.getElementById('video-title').textContent = videoData.title;
            document.getElementById('video-duration').textContent = formatDuration(player.getDuration());
            
            if (document.getElementById('autoplay').checked == true && !isIOS()) {
                if (document.getElementById('randomplayback').checked == true) playVideoAtRandomStartTime();
                else player.playVideo();
            }
        }
        else if (event.data == YT.PlayerState.PLAYING) {
            setUIState('PLAYING');
            visualizerBars.forEach(b => b.classList.add('playing'));
            window.setLocalPlayPauseIcon(true);
            const localMsg = document.getElementById('local-status-message');
            if (localMsg) localMsg.style.display = 'none';
        }
        else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.ENDED) {
            setUIState('PAUSED');
            visualizerBars.forEach(b => b.classList.remove('playing'));
            window.setLocalPlayPauseIcon(false);
        }
        else if (event.data == YT.PlayerState.BUFFERING) {
            setUIState('BUFFERING');
        }
    }

    function formatDuration(duration) {
        var min = Math.floor(duration / 60);
        var sec = duration % 60;
        return min + ":" + (sec < 10 ? '0' : '') + sec;
    }

    document.getElementById('startstop-video').addEventListener('click', function() {
        let state = player.getPlayerState();
        if (state !== YT.PlayerState.PLAYING && state !== YT.PlayerState.BUFFERING) {
            if (document.getElementById('randomplayback').checked == true) playVideoAtRandomStartTime();
            else player.playVideo();
        } else {
            player.pauseVideo();
        }
    });

    function playVideoAtRandomStartTime() {
        let dur = player.getDuration();
        playbackDuration = parseInt(document.getElementById('playback-duration').value, 10) || 30;
        let start = Math.max(currentStartTime, dur * 0.1);
        let end = dur * 0.9;
        let offset = Math.random() * Math.max(0, end - start - playbackDuration);
        let finalStart = start + offset;

        player.seekTo(finalStart, true);
        player.playVideo();

        clearTimeout(playbackTimer); 
        playbackTimer = setTimeout(() => player.pauseVideo(), playbackDuration * 1000); 
    }

    document.getElementById('startScanButton').addEventListener('click', () => {
        setUIState('SCANNING');
        qrScanner.start().then(() => qrScanner.setInversionMode('both')).catch(() => setUIState('IDLE'));
    });
    document.getElementById('cancelScanButton').addEventListener('click', () => { qrScanner.stop(); setUIState('IDLE'); });
    document.getElementById('doneButton').addEventListener('click', () => setUIState('IDLE'));
    document.getElementById('debugButton').addEventListener('click', () => handleScannedLink("https://www.hitstergame.com/de-aaaa0012/237"));
    document.getElementById('songinfo').addEventListener('click', function() {
        ['videoid', 'videotitle', 'videoduration', 'videostart'].forEach(id => {
            document.getElementById(id).style.display = this.checked ? 'block' : 'none';
        });
    });
    document.getElementById('cb_settings').addEventListener('change', function() {
        document.getElementById('settings_div').classList.toggle('hidden', !this.checked);
    });

    document.getElementById('randomplayback').addEventListener('click', function() {
        document.cookie = "RandomPlaybackChecked=" + this.checked + ";max-age=2592000"; 
        listCookies();
    });
    document.getElementById('autoplay').addEventListener('click', function() {
        document.cookie = "autoplayChecked=" + this.checked + ";max-age=2592000"; 
        listCookies();
    });
    document.getElementById('cookies').addEventListener('click', function() {
        document.getElementById('cookielist').style.display = this.checked ? 'block' : 'none';
    });

    function listCookies() { document.getElementById("cookielist").innerHTML = document.cookie; }
    function getCookieValue(name) {
        const match = document.cookie.match(new RegExp(`(^| )${name}=([^;]+)`));
        return match ? match[2] : undefined;
    }
    function getCookies() {
        if (getCookieValue("RandomPlaybackChecked") !== undefined) document.getElementById('randomplayback').checked = (getCookieValue("RandomPlaybackChecked") === 'true');
        if (getCookieValue("autoplayChecked") !== undefined) document.getElementById('autoplay').checked = (getCookieValue("autoplayChecked") === 'true');  
        listCookies();
    }

    window.parseCSV = parseCSV;
    window.parseYoutubeLink = parseYoutubeLink;
    window.getCachedCsv = getCachedCsv;

    window.playYtVideo = function(videoId, start = 0) {
        document.getElementById('video-id').textContent = videoId;
        currentStartTime = start || 0;
        if (player && typeof player.cueVideoById === 'function') {
            player.cueVideoById(videoId, currentStartTime);
            setTimeout(() => {
                player.playVideo();
                setUIState('PLAYING');
            }, 500);
        }
    };

    window.stopYtVideo = function() {
        if (player && typeof player.pauseVideo === 'function') {
            player.pauseVideo();
            setUIState('PAUSED');
        }
    };

    window.toggleYtVideo = function(videoId, start) {
        if (!player || typeof player.getPlayerState !== 'function') return false;
        const videoData = player.getVideoData();
        if (!videoData || videoData.video_id !== videoId) {
            document.getElementById('video-id').textContent = videoId;
            currentStartTime = start || 0;
            player.cueVideoById(videoId, currentStartTime);
            setTimeout(() => {
                player.playVideo();
                setUIState('PLAYING');
            }, 500);
            return true;
        }

        if (player.getPlayerState() === 1) {
            player.pauseVideo();
            return false;
        } else {
            player.playVideo();
            return true;
        }
    };

    document.getElementById('toggleLocalModeButton').addEventListener('click', function() {
        const scannerBox = document.getElementById('scanner-box');
        const doneBtn = document.getElementById('doneButton');
        const settingsToggle = document.getElementById('show_hide_settings');
        const settingsDiv = document.getElementById('settings_div');
        const localUI = document.getElementById('local-mode-ui');
        
        const bottomBar = document.getElementById('local-bottom-bar');
        
        if (localUI.style.display === 'none' || localUI.style.display === '') {
            qrScanner.stop();
            scannerBox.style.display = 'none';
            doneBtn.style.display = 'none';
            settingsToggle.style.display = 'none';
            settingsDiv.classList.add('hidden');
            localUI.style.display = 'flex';
            this.textContent = 'Exit Local Mode';
            const gameboard = document.getElementById('local-gameboard');
            if (bottomBar && gameboard && gameboard.style.display !== 'none') {
                bottomBar.style.display = 'flex';
            }
        } else {
            scannerBox.style.display = 'flex';
            settingsToggle.style.display = 'flex';
            localUI.style.display = 'none';
            if (bottomBar) bottomBar.style.display = 'none';
            this.textContent = 'Local Mode';
            setUIState('IDLE');
            window.stopYtVideo();
        }
    });

    setUIState('IDLE');
    getCookies();
  </script>
